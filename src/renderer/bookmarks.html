<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks - Spàrsh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .add-bookmark-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .add-bookmark-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .bookmark-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .bookmark-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .bookmark-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .bookmark-favicon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .bookmark-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-url {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }

        .bookmark-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            background: rgba(239, 68, 68, 0.15);
            border: none;
            border-radius: 6px;
            color: #ef4444;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bookmark-card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #16213e;
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-family: inherit;
            font-size: 14px;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bookmarks</h1>
            <button class="add-bookmark-btn" id="add-btn">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                    <path d="M8 2v12M2 8h12" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Add Bookmark
            </button>
        </div>

        <div id="bookmarks-container">
            <!-- Bookmarks will be inserted here -->
        </div>
    </div>

    <!-- Add Bookmark Modal -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <div class="modal-title">Add Bookmark</div>
            <form id="bookmark-form">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-input" id="title-input" placeholder="Enter bookmark title" required>
                </div>
                <div class="form-group">
                    <label class="form-label">URL</label>
                    <input type="url" class="form-input" id="url-input" placeholder="https://example.com" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Bookmark</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        let bookmarks = [];

        async function loadBookmarks() {
            bookmarks = await ipcRenderer.invoke('get-bookmarks');
            renderBookmarks();
        }

        function renderBookmarks() {
            const container = document.getElementById('bookmarks-container');
            
            if (bookmarks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⭐</div>
                        <div>No bookmarks yet</div>
                        <div style="margin-top: 8px; font-size: 13px;">Click "Add Bookmark" to save your favorite sites</div>
                    </div>
                `;
                return;
            }

            let html = '<div class="bookmarks-grid">';
            
            bookmarks.forEach(bookmark => {
                const date = bookmark.createdAt ? new Date(bookmark.createdAt).toLocaleDateString() : '';
                html += `
                    <div class="bookmark-card" data-url="${escapeHtml(bookmark.url)}">
                        <button class="delete-btn" data-id="${bookmark.id}">
                            <svg width="12" height="12" viewBox="0 0 12 12">
                                <path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </button>
                        <div class="bookmark-header">
                            <div class="bookmark-favicon">${getIcon(bookmark.url)}</div>
                            <div class="bookmark-title">${escapeHtml(bookmark.title)}</div>
                        </div>
                        <div class="bookmark-url">${escapeHtml(bookmark.url)}</div>
                        ${date ? `<div class="bookmark-date">Added ${date}</div>` : ''}
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;

            // Add click handlers
            document.querySelectorAll('.bookmark-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.delete-btn')) {
                        window.location.href = card.dataset.url;
                    }
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm('Are you sure you want to delete this bookmark?')) {
                        await ipcRenderer.invoke('remove-bookmark', btn.dataset.id);
                        await loadBookmarks();
                    }
                });
            });
        }

        function getIcon(url) {
            try {
                const domain = new URL(url).hostname;
                const icons = {
                    'google.com': '🔍',
                    'youtube.com': '📺',
                    'github.com': '💻',
                    'twitter.com': '🐦',
                    'facebook.com': '📘',
                    'reddit.com': '🤖',
                    'wikipedia.org': '📚',
                    'amazon.com': '🛒',
                    'netflix.com': '🎬'
                };
                
                for (const [key, icon] of Object.entries(icons)) {
                    if (domain.includes(key)) {
                        return icon;
                    }
                }
                return '🌐';
            } catch {
                return '🌐';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Modal handling
        const modal = document.getElementById('add-modal');
        const addBtn = document.getElementById('add-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const form = document.getElementById('bookmark-form');

        addBtn.addEventListener('click', () => {
            modal.classList.add('active');
            document.getElementById('title-input').focus();
        });

        cancelBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            form.reset();
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                form.reset();
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title-input').value;
            const url = document.getElementById('url-input').value;
            
            await ipcRenderer.invoke('add-bookmark', { title, url });
            await loadBookmarks();
            
            modal.classList.remove('active');
            form.reset();
        });

        loadBookmarks();
    </script>
</body>
</html>
