<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spàrsh Browser</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-bar-controls">
                <div class="window-controls">
                    <button class="control minimize" id="minimize-btn"></button>
                    <button class="control maximize" id="maximize-btn"></button>
                    <button class="control close" id="close-btn"></button>
                </div>
            </div>
            <div class="title-bar-title">Spàrsh Browser</div>
        </div>

        <!-- Browser UI -->
        <div class="browser-container">
            <!-- Tab Bar -->
            <div class="tab-bar" id="tab-bar">
                <div class="tabs-container">
                    <div class="tab active" data-tab-id="1">
                        <div class="tab-content">
                            <div class="tab-favicon">🌐</div>
                            <span class="tab-title">New Tab</span>
                            <button class="tab-close">×</button>
                        </div>
                    </div>
                </div>
                <button class="new-tab-btn" id="new-tab-btn">+</button>
            </div>

            <!-- Address Bar -->
            <div class="address-bar-container">
                <div class="address-bar">
                    <div class="nav-buttons">
                        <button class="nav-btn back" id="back-btn" disabled>←</button>
                        <button class="nav-btn forward" id="forward-btn" disabled>→</button>
                        <button class="nav-btn reload" id="reload-btn">↻</button>
                    </div>
                    <div class="address-input-container">
                        <input type="text" class="address-input" id="address-input" placeholder="Search or enter address">
                        <div class="address-suggestions" id="address-suggestions"></div>
                    </div>
                    <div class="address-actions">
                        <button class="action-btn bookmark" id="bookmark-btn">★</button>
                        <button class="action-btn menu" id="menu-btn">⋮</button>
                    </div>
                </div>
            </div>

            <!-- Web Content Area -->
            <div class="content-area">
                <div class="webview-container" id="webview-container">
                    <div class="new-tab-page" id="new-tab-page">
                        <div class="new-tab-content">
                            <div class="logo">
                                <h1>Spàrsh</h1>
                                <p>Fast, Secure, Beautiful</p>
                            </div>
                            <div class="search-container">
                                <input type="text" class="search-input" id="search-input" placeholder="Search the web">
                                <button class="search-btn" id="search-btn">Search</button>
                            </div>
                            <div class="shortcuts" id="shortcuts">
                                <div class="shortcut-item">
                                    <div class="shortcut-icon">📧</div>
                                    <span>Gmail</span>
                                </div>
                                <div class="shortcut-item">
                                    <div class="shortcut-icon">📺</div>
                                    <span>YouTube</span>
                                </div>
                                <div class="shortcut-item">
                                    <div class="shortcut-icon">🐦</div>
                                    <span>Twitter</span>
                                </div>
                                <div class="shortcut-item">
                                    <div class="shortcut-icon">📘</div>
                                    <span>Facebook</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar" id="status-bar">
                <div class="status-left">
                    <span class="status-text" id="status-text">Ready</span>
                </div>
                <div class="status-right">
                    <div class="security-indicator" id="security-indicator">🔒</div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
